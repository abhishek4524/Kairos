name: Backend Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
        working-directory: .

      - name: Set test environment variables
        run: |
          echo "GROQ_API_KEY=mock_groq_api_key_ci" >> $GITHUB_ENV
          echo "NVIDIA_API_KEY=mock_nvidia_api_key_ci" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=testadmin123" >> $GITHUB_ENV
          echo "KAIROS_SECURITY_MODE=strict" >> $GITHUB_ENV
          echo "STT_MODE=api" >> $GITHUB_ENV

      - name: Run tests with coverage
        run: |
          python -m pytest backend/tests/ -v \
            --cov=agent_tools.executor \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70
        working-directory: backend/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
